name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    name: spec (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every minor the gemspec's `>= 3.2, < 5` promises. Ruby 3.4 was
        # followed by 4.0; there is no 3.5 line. Adding a Ruby here without
        # widening the gemspec, or vice versa, fails spec/edge/packaging_spec.rb.
        ruby: ["3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop
