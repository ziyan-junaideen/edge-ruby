---
generated_by: contract/bin/extract_manifest.rb
generated_from: Phoenix views + controllers; enum values and routes from contract/openapi.json
caveats:
- 'openapi.json describes responses only. Every write has requestBody: null, so writable
  ATTRIBUTES are not derivable and are not asserted here. Relationship writeability
  IS derivable, from `readonly: true` in each view.'
- 'Enum values come from the openapi.json snapshot, which is a gitignored build artifact
  that lags the server. Treat them as a lower bound: the client must accept unknown
  values.'
- sensitive_fields is hand-maintained in this script and errs wide. It is a redaction
  obligation, not a claim about how secret a field is.
- idempotent_writes marks resources whose views document a replay contract. It does
  NOT authorise automatic retries; each operation must be exercised against sandbox
  first.
warnings:
- 'beneficial_owners.ex: icon_url is in the snapshot but not in the view'
- 'beneficial_owners.ex: login_url is in the snapshot but not in the view'
- 'beneficial_owners.ex: logo_url is in the snapshot but not in the view'
- 'beneficial_owners.ex: name is in the snapshot but not in the view'
- 'beneficial_owners.ex: primary_colour is in the snapshot but not in the view'
- 'beneficial_owners.ex: state is in the snapshot but not in the view'
- 'financial_institutions.ex: view type/0 is "beneficial_owners" but the route is
  /financial_institutions - responses from that route are mistyped'
- 'financial_institutions.ex: JSON:API type "beneficial_owners" is already claimed
  by beneficial_owners'
- 'meter_ticks.ex: declares idempotency_key but documents no replay contract; writes
  stay non-retryable'
- 'payment_demands.ex: amount_refunded_cents is in the snapshot but not in the view'
- 'payment_methods.ex: enum kind resolved from the snapshot only'
- 'payment_subscriptions.ex: billing_period accessor Core.Transactions.PaymentSubscription.billing_periods()
  is defined in lib/core/purchases/link.ex and lib/core/transactions/payment.ex; not
  resolving from source'
- 'payment_subscriptions.ex: enum billing_period resolved from the snapshot only'
- 'payment_subscriptions.ex: declares idempotency_key but documents no replay contract;
  writes stay non-retryable'
- 'red_flags.ex: enum violation resolved from the snapshot only'
always_redact:
- authorization
- api_key
- secret_key
- token
