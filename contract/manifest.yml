---
caveats:
- 'Attributes and relationships describe what the server actually serializes. Where
  Edge documents a field the server does not serve, it is kept with `from: openapi-snapshot-only`.'
- Writable ATTRIBUTES are stated per operation in the resource classes, not here.
  Relationship writeability is recorded here.
- Enum values are a lower bound that can lag the server. The client must accept unknown
  values.
- sensitive_fields is hand-maintained and errs wide. It is a redaction obligation,
  not a claim about how secret a field is.
- idempotent_writes marks resources whose replay contract has been verified against
  sandbox. It does NOT authorise automatic retries on its own; the caller still opts
  in per request.
always_redact:
- authorization
- api_key
- secret_key
- token
